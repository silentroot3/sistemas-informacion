services:
  db:
    image: mariadb:11.4
    container_name: mariadb_local
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: 5252
      MARIADB_DATABASE: info
      MARIADB_USER: silentroot
      MARIADB_PASSWORD: 5252
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: node_app_local
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=silentroot
      - DB_PASSWORD=5252
      - DB_NAME=info
      - DB_PORT=3306
      - SESSION_SECRET=12345670192858105302812519
    volumes:
      - ./node-app:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
